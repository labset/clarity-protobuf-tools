version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go fmt ./...
    - go test ./...

builds:
  - main: cmd/protoc-gen-labset-go/main.go
    id: protoc-gen-labset-go
    binary: protoc-gen-labset-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

  - main: cmd/labset-lint-plugin/main.go
    id: labset-lint-plugin
    binary: labset-lint-plugin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - id: protoc-gen-labset-go
    ids: [protoc-gen-labset-go]
    formats: [tar.gz]
    name_template: >-
      protoc-gen-labset-go_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: labset-lint-plugin
    ids: [labset-lint-plugin]
    formats: [tar.gz]
    name_template: >-
      labset-lint-plugin_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
