[tools]
go = "1.26.2"
buf = "1.67.0"
golangci-lint = "2.10.0"
goreleaser = "2.12.7"
sqlc = "1.29.0"
"aqua:ariga/atlas" = "1.1.0"

##############
# Main Tasks
##############

[tasks.deps]
description = "Download Go module dependencies"
run = "go mod download"

[tasks.lint]
description = "Lint all"
depends = ["go:lint", "buf:lint"]

[tasks."lint:fix"]
description = "Fix lint issues"
depends = ["go:lint:fix", "buf:lint"]

[tasks.format]
description = "Format all"
depends = ["go:format", "buf:format"]

[tasks.build]
description = "Build the project using goreleaser"
run = "goreleaser build --clean --snapshot"

[tasks.generate]
description = "Generate code from proto files"
run = "buf generate --template buf.gen.api.yaml"

[tasks.install]
description = "Install the plugin locally"
run = "go install ./cmd/..."

#############
# Go Tasks
#############

[tasks."go:test"]
description = "Run Go tests"
run = "go test ./..."

[tasks."go:vet"]
description = "Run go vet"
run = "go vet ./..."

[tasks."go:lint"]
description = "Run golangci-lint on the codebase"
run = "golangci-lint run"

[tasks."go:lint:fix"]
description = "Run golangci-lint fix on the codebase"
run = "golangci-lint run --fix"

[tasks."go:format"]
description = "Run go format"
run = "go fmt ./..."

##############
# Buf Tasks
##############

[tasks."buf:lint"]
description = "Lint proto files"
run = "buf lint"

[tasks."buf:format"]
description = "Format proto files in place"
run = "buf format --write"

##############
# E2E Tasks
##############

[tasks."e2e:connect-crud-outbox"]
description = "Run e2e tests for connect-crud-outbox"
dir = "test/connect-crud-outbox"
depends = ["e2e:connect-crud-outbox:tidy"]
run = "go test -v -count=1 ./e2e/..."

[tasks."e2e:connect-crud-outbox:buf"]
description = "Run buf generate for connect-crud-outbox e2e test"
dir = "test/connect-crud-outbox/schema"
depends = ["install"]
run = "buf generate"

[tasks."e2e:connect-crud-outbox:sqlc"]
description = "Run sqlc generate for connect-crud-outbox e2e test"
dir = "test/connect-crud-outbox"
depends = ["e2e:connect-crud-outbox:buf"]
run = "go generate ./..."

[tasks."e2e:connect-crud-outbox:tidy"]
description = "Tidy go.mod for connect-crud-outbox e2e test"
dir = "test/connect-crud-outbox"
depends = ["e2e:connect-crud-outbox:sqlc"]
run = "go mod tidy"

[tasks."e2e:connect-crud-outbox:build"]
description = "Verify generated code compiles for connect-crud-outbox e2e test"
dir = "test/connect-crud-outbox"
depends = ["e2e:connect-crud-outbox:tidy"]
run = "go build ./..."
