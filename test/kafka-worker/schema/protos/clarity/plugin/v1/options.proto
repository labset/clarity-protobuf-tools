syntax = "proto3";

package clarity.plugin.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/labset/clarity-protobuf-tools/api/clarity/plugin/v1;pluginV1";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ENTITY = 1;
  ROLE_REFERENCE = 2;
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_CREATE = 1;
  OPERATION_GET = 2;
  OPERATION_LIST = 3;
  OPERATION_UPDATE = 4;
  OPERATION_DELETE = 5;
}

enum Subscriber {
  SUBSCRIBER_UNSPECIFIED = 0;
  SUBSCRIBER_AUDIT = 1;
  SUBSCRIBER_INDEX = 2;
  SUBSCRIBER_WEBHOOK = 3;
  SUBSCRIBER_NOTIFICATION = 4;
}

message ClarityMessageOptions {
  Role role = 1;
  repeated Operation operations = 2;
  repeated Subscriber subscribers = 3;
}

message ClarityFieldOptions {
  bool foreign_key = 1;
}

extend google.protobuf.MessageOptions {
  ClarityMessageOptions message = 50001;
}

extend google.protobuf.FieldOptions {
  ClarityFieldOptions field = 50002;
}
