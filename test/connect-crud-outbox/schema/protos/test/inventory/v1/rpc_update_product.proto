syntax = "proto3";

package test.inventory.v1;

option go_package = "github.com/labset/clarity-protobuf-tools/test/connect-crud-outbox/schema/gen/test/inventory/v1;inventoryv1";

import "test/inventory/v1/models.proto";
import "google/protobuf/field_mask.proto";

message UpdateProductRequest {
  string id = 1;
  Product item = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateProductResponse {
  Product item = 1;
}
